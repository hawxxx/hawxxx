<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title description">
  <title id="title">Cristhian — Platform, Distributed Systems, GPU and AI</title>
  <desc id="description">A dark banner with floating technology tiles and animated engineering specialties.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="218" rx="12" /></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151d" />
      <stop offset="0.25" stop-color="#10151d" stop-opacity="0" />
      <stop offset="0.75" stop-color="#10151d" stop-opacity="0" />
      <stop offset="1" stop-color="#10151d" />
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#58a6ff" /><stop offset="1" stop-color="#a78bfa" /></linearGradient>
    <g id="tile"><rect width="58" height="58" rx="10" fill="#161e2a" stroke="#2a3647" /></g>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .label { font-family: monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .left { animation: drift 9s ease-in-out infinite alternate; }
    .right { animation: drift 11s ease-in-out infinite alternate-reverse; }
    .role { font-size: 21px; font-weight: 600; text-anchor: middle; opacity: 0; animation: role 20s infinite; }
    .second { animation-delay: 5s; }
    .third { animation-delay: 10s; }
    .fourth { animation-delay: 15s; }
    @keyframes drift { from { transform: translateY(-7px); } to { transform: translateY(7px); } }
    @keyframes role { 0%, 21% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .left, .right, .role { animation: none; }
      .role { opacity: 1; }
      .second, .third, .fourth { display: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="999" height="219" rx="12" fill="#10151d" stroke="#303d4d" />
  <g clip-path="url(#frame)">
    <g class="left">
      <g transform="translate(22,-18)"><use href="#tile" /><text class="label" x="29" y="34" fill="#ffa657">AWS</text></g>
      <g transform="translate(22,52)"><use href="#tile" /><text class="label" x="29" y="34" fill="#e6edf3">KAFKA</text></g>
      <g transform="translate(22,122)"><use href="#tile" /><text class="label" x="29" y="34" fill="#7ee787">BASH</text></g>
      <g transform="translate(92,17)"><use href="#tile" /><text class="label" x="29" y="34" fill="#a78bfa">K8s</text></g>
      <g transform="translate(92,87)"><use href="#tile" /><text class="label" x="29" y="34" fill="#f2cc60">PYTHON</text></g>
      <g transform="translate(92,157)"><use href="#tile" /><text class="label" x="29" y="34" fill="#58a6ff">TS</text></g>
      <g transform="translate(162,-18)"><use href="#tile" /><text class="label" x="29" y="34" fill="#ffa657">JAVA</text></g>
      <g transform="translate(162,52)"><use href="#tile" /><text class="label" x="29" y="34" fill="#79c0ff">SQL</text></g>
      <g transform="translate(162,122)"><use href="#tile" /><text class="label" x="29" y="34" fill="#ff7b72">SCALA</text></g>
      <g transform="translate(22,192)"><use href="#tile" /></g>
    </g>
    <g class="right">
      <g transform="translate(780,-18)"><use href="#tile" /><text class="label" x="29" y="34" fill="#7ee787">GPU</text></g>
      <g transform="translate(780,52)"><use href="#tile" /><rect x="15" y="15" width="28" height="28" rx="4" fill="none" stroke="#7ee787" stroke-width="2" /><path d="M21 9v6m8-6v6m8-6v6M21 43v6m8-6v6m8-6v6M9 21h6m-6 8h6m-6 8h6m28-16h6m-6 8h6m-6 8h6" stroke="#7ee787" stroke-width="2" /><text class="label" x="29" y="33" fill="#7ee787">GPU</text></g>
      <g transform="translate(780,122)"><use href="#tile" /><text class="label" x="29" y="34" fill="#ffa657">MSK</text></g>
      <g transform="translate(850,17)"><use href="#tile" /><text class="label" x="29" y="34" fill="#a78bfa">AI</text></g>
      <g transform="translate(850,87)"><use href="#tile" /><path d="M17 17 29 29 41 17M17 41 29 29 41 41" fill="none" stroke="#a78bfa" stroke-width="2" /><g fill="#a78bfa"><circle cx="17" cy="17" r="4" /><circle cx="41" cy="17" r="4" /><circle cx="29" cy="29" r="5" /><circle cx="17" cy="41" r="4" /><circle cx="41" cy="41" r="4" /></g></g>
      <g transform="translate(850,157)"><use href="#tile" /><text class="label" x="29" y="34" fill="#7ee787">LINUX</text></g>
      <g transform="translate(920,-18)"><use href="#tile" /><text class="label" x="29" y="34" fill="#ffa657">O11Y</text></g>
      <g transform="translate(920,52)"><use href="#tile" /><text class="label" x="29" y="34" fill="#79c0ff">LLM</text></g>
      <g transform="translate(920,122)"><use href="#tile" /><text class="label" x="29" y="34" fill="#58a6ff">REACT</text></g>
      <g transform="translate(780,192)"><use href="#tile" /></g>
    </g>
    <rect x="1" y="1" width="998" height="218" fill="url(#fade)" />
  </g>
  <text x="500" y="63" fill="#8b99ab" font-size="12" letter-spacing="3" text-anchor="middle">COMPUTER ENGINEER</text>
  <text x="500" y="106" fill="#f0f6fc" font-size="42" font-weight="700" letter-spacing="-1" text-anchor="middle">Cristhian</text>
  <g fill="#b8d7ff">
    <text class="role" x="500" y="143">Platform Engineering</text>
    <text class="role second" x="500" y="143">Distributed Systems</text>
    <text class="role third" x="500" y="143">GPU &amp; AI</text>
    <text class="role fourth" x="500" y="143">Developer Tooling</text>
  </g>
  <rect x="425" y="170" width="150" height="27" rx="13.5" fill="#0d1117" stroke="url(#accent)" />
  <circle cx="441" cy="183.5" r="3" fill="#7ee787" />
  <text x="507" y="187.5" fill="#c9d1d9" font-size="11" text-anchor="middle">building gifio.app</text>
</svg>
